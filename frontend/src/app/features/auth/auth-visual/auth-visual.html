<figure class="visual">
  <img class="visual__image" [src]="imageUrl()" [alt]="imageAlt()" fetchpriority="high" />
  <div class="visual__scrim" aria-hidden="true"></div>

  <div class="visual__content">
    <div class="visual__top">
      <span class="visual__badge">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" fill="currentColor" />
          <ellipse
            cx="12"
            cy="12"
            rx="9"
            ry="4.3"
            transform="rotate(-28 12 12)"
            stroke="currentColor"
            stroke-width="1.3"
          />
        </svg>
        <span>{{ eyebrow() }}</span>
      </span>
    </div>

    <div class="visual__copy">
      <h2 class="visual__title">{{ title() }}</h2>
      <p class="visual__subtitle">{{ subtitle() }}</p>
    </div>
  </div>
</figure>
